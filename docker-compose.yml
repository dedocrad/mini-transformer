services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - mlflow-data:/mlflow/mlruns
    environment:
      MLFLOW_TRACKING_URI: file:/mlflow/mlruns

  mlflow:
    build: .
    command: ["mlflow", "ui", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "file:/mlflow/mlruns"]
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow/mlruns

volumes:
  mlflow-data:
