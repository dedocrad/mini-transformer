version: "3.9"

services:
  mini-transformer:
    build: .
    container_name: mini-transformer
    ports:
      - "8501:8501"   # Streamlit
      - "5000:5000"   # MLflow UI
    stdin_open: true
    tty: true
    volumes:
      - ./mlruns:/mlflow/mlruns
    environment:
      - MLFLOW_TRACKING_URI=file:/mlflow/mlruns
